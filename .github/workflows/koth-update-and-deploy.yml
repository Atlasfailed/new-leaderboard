name: Deploy KOTH Website

on:
  push:
    branches:
      - main
    paths:
      - "koth/site/**"
      - "koth/package.json"
      - "koth/package-lock.json"
      - ".github/workflows/koth-update-and-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koth-website-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: koth

jobs:
  deploy-website:
    # Keep the existing live site until the separate data project is ready.
    if: vars.KOTH_DATA_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out latest website
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: koth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify the independent data endpoint before switching the website
        run: |
          node -e 'const {validateRankings} = require("./site/assets/data.js"); const {DATA_URL} = require("./pipeline/publish_rankings.cjs"); (async () => { const response = await fetch(DATA_URL, {cache:"no-cache", signal:AbortSignal.timeout(30000)}); if (!response.ok || response.headers.get("Access-Control-Allow-Origin") !== "*") throw new Error("Data endpoint unavailable or CORS missing"); const data = validateRankings(await response.json()); if (data.schemaVersion !== 1) throw new Error("Data endpoint requires schema v1"); })().catch(error => { console.error(error); process.exitCode = 1; });'

      - name: Deploy website without rebuilding or publishing rankings
        run: npm run deploy-site
