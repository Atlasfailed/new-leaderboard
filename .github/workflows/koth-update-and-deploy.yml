name: Update KOTH Leaderboard and Deploy

on:
  push:
    branches:
      - main
    paths:
      - "koth/**"
      - ".github/workflows/koth-update-and-deploy.yml"
  schedule:
    # Games are played on Sundays; scan on Monday morning (UTC).
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: koth-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: koth

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: koth/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Scan for new games and build data
        run: python -m pipeline.custom_games --output site/data

      - name: Commit updated replay cache
        run: |
          if git diff --quiet -- pipeline/reference/custom_games.json; then
            echo "No new games."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/reference/custom_games.json
          git commit -m "Update KOTH games"
          git pull --rebase origin main
          git push

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: koth
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=allreasonnologic-koth --branch=main --commit-dirty=true
